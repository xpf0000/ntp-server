name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag whose release assets to publish or repair
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.mod

      - name: Verify formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'gofmt required for:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./... -count=1

      - name: Race test
        if: runner.os == 'Linux'
        run: go test ./... -race -count=1

      - name: Build server
        run: go build ./cmd/ntp-server

  release:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout tagged service source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ format('refs/tags/{0}', inputs.release_tag || github.ref_name) }}
          path: release-source

      - name: Checkout release tools
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: release-tools

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: release-source/go.mod

      - name: Test release publisher
        run: python3 -B release-tools/scripts/publish_release_test.py

      - name: Build six platform binaries
        shell: bash
        working-directory: release-source
        run: bash scripts/build.sh "$RELEASE_TAG" ../dist/bin

      - name: Package binaries and checksums
        shell: bash
        working-directory: release-source
        run: bash scripts/package-release.sh ../dist/bin ../dist/release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B release-tools/scripts/publish_release.py "$RELEASE_TAG" dist/release
